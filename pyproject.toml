[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econocausal"
version = "1.0.0"
description = "Causal-AI pricing engine using Double ML for individual treatment effect estimation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Infotact Solutions — Data Associate L1"}]

dependencies = [
    # Core scientific stack
    "numpy>=1.26.4,<2.0",
    "pandas>=2.2.2,<3.0",
    "pyarrow>=15.0.2,<16.0",
    "scipy>=1.13.1,<2.0",
    "scikit-learn>=1.5.1,<2.0",
    # Causal inference
    "econml==0.15.1",
    "dowhy==0.11.1",
    "lightgbm>=4.3.0,<5.0",
    # Data validation
    "pandera>=0.20.3,<1.0",
    # API
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.30.1,<1.0",
    "pydantic>=2.7.1,<3.0",
    "pydantic-settings>=2.3.4,<3.0",
    "python-multipart>=0.0.9,<1.0",
    # Utilities
    "joblib>=1.4.2,<2.0",
    "structlog>=24.2.0,<25.0",
    "matplotlib>=3.9.0,<4.0",
    "statsmodels>=0.14.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-asyncio>=0.23.7,<1.0",
    "hypothesis>=6.103.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "types-requests>=2.32.0",
    "pre-commit>=3.7.1,<4.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/econocausal"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "backend/tests", "backend/scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "S", "B", "C4", "PT", "RUF"]
ignore = [
    "ANN401",
    "S101",    # allow assert in tests
    "S311",    # allow standard pseudo-random (we use numpy rng)
    "S104",    # allow 0.0.0.0 bind
    "N806",    # allow uppercase math matrix variables (X, Y, T, A_ub)
    "N803",    # allow uppercase argument names
    "B008",    # allow FastAPI File/Query/Depends in default args
    "RUF001",  # allow unicode quotes
    "RUF002",  # allow unicode characters in docstrings
    "E501",    # line length handled by ruff format
]

per-file-ignores = {"backend/tests/*" = ["ANN", "S", "RUF043"], "backend/scripts/*" = ["ANN", "S"]}

[tool.ruff.lint.isort]
known-first-party = ["econocausal"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "backend/src"
exclude = ["backend/tests", "backend/scripts", "notebooks"]

[[tool.mypy.overrides]]
module = ["econml.*", "dowhy.*", "lightgbm.*", "pandera.*", "structlog.*", "statsmodels.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = [
    "--cov=econocausal",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-fail-under=80",
    "-v",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend/src/econocausal"]
omit = ["*/tests/*", "*/scripts/*"]
